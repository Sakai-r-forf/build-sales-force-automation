services:
  app:
    build: .
    ports:
      - "127.0.0.1:9020:8080"
    env_file:
      - path: .env
        required: false
    environment:
      STATE_PATH: /data/state.json
      PORT: 8080
      TZ: Asia/Tokyo
    volumes:
      - app_data:/data
    restart: unless-stopped
volumes:
  app_data:
